services:
  foodie-postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: foodie
      POSTGRES_USER: foodie
      POSTGRES_PASSWORD: ${FOODIE_DB_PASSWORD:?Set FOODIE_DB_PASSWORD for local PostgreSQL}
    ports:
      - "5432:5432"
    volumes:
      - foodie-postgres-data:/var/lib/postgresql

volumes:
  foodie-postgres-data:
